# Anatomy manifest.
#
# NAHPU is a natural-history app, so its taxon icons are read by people who know
# what the animals look like. This file is the checked-in record of how many
# limbs each mark draws, and `main.py lint` verifies it against the SVG sources
# by counting elements with the matching `data-role`.
#
# Counts are of *drawn elements*, not of the animal's real anatomy, because the
# two differ legitimately:
#
#   * View. A flea in lateral profile shows three legs, not six. A bird shows
#     two because it has two.
#   * Silhouette. Features drawn into the silhouette path cannot be counted -
#     a butterfly's wings are part of its outline, so `wings = 0` there. Any
#     limb that must be counted has to be a stroked element.
#   * Legibility. Some marks deliberately omit limbs; those carry a `note`
#     saying so, which is the whole point of this file. Without it an omission
#     is indistinguishable from an oversight.
#
# Roles that are counted: leg, antenna, wing. Other roles (eye, ear, tail, head,
# detail) are validated as known roles but not counted.

[ant]
legs = 6
antennae = 2
wings = 0
note = "Worker ant: six legs on the mesosoma, elbowed antennae, no wings."

[bat]
legs = 0
antennae = 0
wings = 0
note = "Head-on view: spread scalloped wings and pointed ears incorporated into the unified silhouette."

[beetle]
legs = 6
antennae = 2
wings = 0
note = "Elytra are part of the silhouette, so no wing elements."

[bird]
legs = 2
antennae = 0
wings = 1
note = "Parrot in lateral profile: two legs, one folded wing visible."

[bone]
legs = 0
antennae = 0
wings = 0

[butterfly]
legs = 0
antennae = 2
wings = 0
note = "Wings are the silhouette. Legs omitted: six legs under those wings is mud at 16 px."

[dragonfly]
legs = 0
antennae = 0
wings = 4
note = "Four separate wings. Legs omitted for legibility; antennae are vestigial anyway."

[egg]
legs = 0
antennae = 0
wings = 0

[fish]
legs = 0
antennae = 0
wings = 0
note = "Fins are in the silhouette except the pectoral, which is a detail stroke."

[flea]
legs = 3
antennae = 1
wings = 0
note = "Laterally compressed, so a profile shows three legs and one antenna, not six and two."

[fly]
legs = 0
antennae = 2
wings = 2
note = "Legs omitted for legibility; the two wings are the dipteran field mark."

[fossil]
legs = 0
antennae = 0
wings = 0
note = "Fossil shark tooth centered inside a smooth asymmetric rock border; only the tooth fills in the filled variant."

[frog]
legs = 2
antennae = 0
wings = 0
note = "Head-on crouch: two folded hind limbs are visible; forelegs are omitted for legibility."

[lizard]
legs = 4
antennae = 0
wings = 0

[louse]
legs = 6
antennae = 2
wings = 0
note = "Wingless ectoparasite; all six legs hook-tipped."

[millipede]
legs = 9
antennae = 2
wings = 0
note = "Nine legs around the coil stand in for many; a literal count is not drawable here."

[mite]
legs = 8
antennae = 0
wings = 0
note = "Adult acarine: four pairs, no antennae."

[moth]
legs = 0
antennae = 2
wings = 0
note = "Wings are the silhouette. Feathered antennae separate it from the butterfly."

[mouse]
legs = 0
antennae = 0
wings = 0
note = "Shape-led: compact body, short snout, oversized round ear, and short curved tail."

[nest]
legs = 0
antennae = 0
wings = 0

[rat]
legs = 2
antennae = 0
wings = 0
note = "Lateral crouch: arched body, small ear, two visible legs, and a long looping tail."

[salamander]
legs = 4
antennae = 0
wings = 0

[shrew]
legs = 2
antennae = 0
wings = 0
note = "Lateral profile: two visible legs, long pointed snout, and no visible ear."

[skull]
legs = 0
antennae = 0
wings = 0

[snake]
legs = 0
antennae = 0
wings = 0
note = "Limbless, smooth S-coiled body with head, eye, and forked tongue."

[spider]
legs = 8
antennae = 0
wings = 0
note = "Araneid: four pairs, every one attached to the cephalothorax. No antennae."

[tag]
legs = 0
antennae = 0
wings = 0

[tick]
legs = 8
antennae = 0
wings = 0
note = "Adult ixodid has eight legs; six would draw a larva. Clustered on the front third."

[turtle]
legs = 4
antennae = 0
wings = 0

[vial]
legs = 0
antennae = 0
wings = 0

[wasp]
legs = 0
antennae = 2
wings = 2
note = "Legs omitted for legibility; the pinched petiole carries the mark."
